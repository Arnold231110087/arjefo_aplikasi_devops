# Pipeline CI PustakaKu (Anggota 1 - dipasang sejak push pertama)
#
# Berjalan di setiap push & pull request ke main:
#   1. backend-test   -> install dependency + cek sintaks semua file + unit test backend
#   2. frontend-build -> install dependency + build React
# Jika CI lulus di branch main, pipeline CD (cd.yml milik Anggota 5) otomatis berjalan.

name: CI PustakaKu

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  backend-test:
    name: CI - Test Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Cek sintaks semua file
        run: for f in $(find src -name "*.js"); do node --check "$f"; done
      - name: Unit test
        run: npm test

  frontend-build:
    name: CI - Build Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
