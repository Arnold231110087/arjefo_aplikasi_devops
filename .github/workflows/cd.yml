name: CD PustakaKu

on:
  workflow_run:
    workflows: ["CI PustakaKu"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

env:
  SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  integration-test:
    name: CD - Uji 3 Container (FE, BE, DB)
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}
      - name: Jalankan container db, backend, frontend
        run: docker compose up -d --build
      - name: Tunggu aplikasi siap
        run: |
          for i in $(seq 1 60); do
            if curl -fs http://localhost:8080/api/health; then echo; echo "Aplikasi siap"; exit 0; fi
            echo "Menunggu... ($i)"; sleep 3
          done
          echo "Aplikasi tidak siap"; exit 1
      - name: Smoke test API lewat Nginx
        run: |
          set -e
          curl -fs http://localhost:8080/ | grep -q "PustakaKu"
          curl -fs http://localhost:8080/api/books | grep -q "Laskar Pelangi"
          TOKEN=$(curl -fs -X POST http://localhost:8080/api/auth/login \
            -H "Content-Type: application/json" \
            -d '{"email":"admin@pustakaku.id","password":"admin123"}' | jq -r .token)
          test "$TOKEN" != "null"
          curl -fs http://localhost:8080/api/dashboard/stats -H "Authorization: Bearer $TOKEN" | jq .books
          curl -fs -X POST http://localhost:8080/api/loans -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" -d '{"book_id":1}' | jq .
          # Buku 7 stoknya 1: admin pinjam, lalu anggota baru masuk antrean reservasi
          curl -fs -X POST http://localhost:8080/api/loans -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" -d '{"book_id":7}' | jq .
          MEMBER=$(curl -fs -X POST http://localhost:8080/api/auth/register \
            -H "Content-Type: application/json" \
            -d '{"name":"CI Bot","email":"ci@pustakaku.id","password":"rahasia"}' | jq -r .token)
          curl -fs -X POST http://localhost:8080/api/reservations -H "Authorization: Bearer $MEMBER" \
            -H "Content-Type: application/json" -d '{"book_id":7}' | jq -e '.position == 1'
          echo "Semua smoke test lulus"
      - name: Status container
        if: always()
        run: docker compose ps
      - name: Log jika gagal
        if: failure()
        run: docker compose logs
      - name: Bersihkan
        if: always()
        run: docker compose down -v

  build-and-push:
    name: CD - Build & Push Image
    runs-on: ubuntu-latest
    needs: integration-test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}
      - uses: docker/setup-buildx-action@v3
      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/pustakaku-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/pustakaku-backend:${{ env.SHA }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/pustakaku-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/pustakaku-frontend:${{ env.SHA }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  deploy-vps:
    name: CD - Deploy ke Server (SSH)
    runs-on: ubuntu-latest
    needs: build-and-push
    if: vars.DEPLOY_TARGET == 'vps'
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}
      - name: Salin file compose & skema DB ke server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "docker-compose.prod.yml,database/init.sql"
          target: "~/pustakaku"
      - name: Pull image terbaru & restart container
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd ~/pustakaku
            export DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }}
            export TAG=${{ env.SHA }}
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d
            docker image prune -f
            sleep 15
            curl -fs http://localhost/api/health
            
  deploy-local:
    name: CD - Deploy ke Self-hosted Runner
    runs-on: self-hosted
    needs: build-and-push
    if: vars.DEPLOY_TARGET == 'local'
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      TAG: ${{ github.event.workflow_run.head_sha || github.sha }}
      APP_PORT: 80
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}
      - run: docker compose -f docker-compose.prod.yml pull
      - run: docker compose -f docker-compose.prod.yml up -d
      - run: docker image prune -f
      - run: docker compose -f docker-compose.prod.yml ps
