services:
  database:
    image: mysql:8.0
    container_name: pustakaku-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: pustakaku_db
      MYSQL_USER: dbuser
      MYSQL_PASSWORD: dbpassword
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    networks:
      - pustakaku-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    image: pustakaku-backend:local
    container_name: pustakaku-backend
    restart: unless-stopped
    environment:
      DB_HOST: database
      DB_USER: dbuser
      DB_PASSWORD: dbpassword
      DB_NAME: pustakaku_db
      DB_PORT: 3306
      PORT: 5000
      APP_VERSION: dev
      ADMIN_EMAIL: admin@pustakaku.id
      ADMIN_PASSWORD: admin123
    depends_on:
      database:
        condition: service_healthy
    networks:
      - pustakaku-net

  frontend:
    build: ./frontend
    image: pustakaku-frontend:local
    container_name: pustakaku-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${APP_PORT:-8080}:80"
    networks:
      - pustakaku-net

volumes:
  db_data:

networks:
  pustakaku-net:
    driver: bridge