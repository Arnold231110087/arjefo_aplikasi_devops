# Konfigurasi Nginx untuk container frontend (Anggota 4)
# - Menyajikan hasil build React
# - Reverse proxy /api ke container backend (nama service "backend" di docker-compose)
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /api/ {
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Supaya refresh halaman React Router (mis. /loans) tidak 404
    location / {
        try_files $uri $uri/ /index.html;
    }
}
